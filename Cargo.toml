[package]
name = "pm"
version = "0.2.0-rc.1"
edition = "2024"
description = "Terminal-based project manager built around tmux and git worktrees"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.0"
chrono = { version = "0.4.44", features = ["serde"] }
thiserror = "2.0.18"
dirs = "6.0.0"
clap_complete = "4.6.0"
serde_json = "1.0"
libc = "0.2"
tempfile = "3.27.0"
toml_edit = "0.25.15"
tiny_http = "0.12.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
qrcode = { version = "0.14.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
ruzstd = "0.9.0"
base64ct = { version = "1", features = ["alloc"] }
web-push-native = "0.5.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
http = "1"
semver = "1.0.28"

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
regex = "1"
